name: Reliability batch validation

# Dispatched by hand on the ref to validate. Never on push or pull_request:
# the repository's workflow rules (tests/test_cloud_gate.py) keep every
# workflow off code that has not been chosen deliberately, and pin every
# action to a full commit SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install declared dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt
      - name: Validate exact head in an isolated worktree
        env:
          BATCH_BASE: 0f13c5c90a66621774000c6eb368df82b10e95cd
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          HEAD_SHA=$(git rev-parse HEAD)
          export LOSSLIFT_WORKTREES="$RUNNER_TEMP/losslift-validation-worktrees"
          bash scripts/agent_worktree.sh create validation --agent ci --base "$HEAD_SHA"
          cd "$LOSSLIFT_WORKTREES/ci--validation"
          echo "VALIDATED_HEAD=$HEAD_SHA"
          bash scripts/agent_validate.sh --base "$BATCH_BASE"
          python -m tests.fuzz.run --family clean --seed-start 0 --count 20
          python -m tests.fuzz.run --family hostile --seed-start 0 --count 20
